name: Windows desktop build
on:
  push:
    branches: [main, "codex/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run check:branding
      - run: npm test
      - run: npm run build
      - name: Rust formatting and unit tests
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo test --manifest-path src-tauri/Cargo.toml --locked --features custom-protocol -- --nocapture --test-threads=1
      - name: Read-only Windows discovery smoke test
        shell: powershell
        run: |
          $json = & ./src-tauri/scripts/discover.ps1
          $report = $json | ConvertFrom-Json
          if ($null -eq $report.collectedAt -or $null -eq $report.devices -or $null -eq $report.errors) { throw 'Invalid discovery envelope' }
          Write-Host "Observed $($report.devices.Count) entries; $($report.errors.Count) collection errors"
          # Hosted runners may have no USB hardware. Do not require a fake minimum count.
      - name: Package Windows installer
        run: npm run package
      - name: Native discovery and fallback parity
        shell: pwsh
        run: ./scripts/verify-native.ps1 -Executable ./src-tauri/target/release/anydevice.exe
      - name: Read-only native input mapping smoke
        shell: pwsh
        run: |
          $owner = & ./src-tauri/target/release/anydevice.exe --input-owner-smoke | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $owner.ownerVerified -or $owner.inputCollected) { throw 'Trusted-owner smoke failed' }
          $denied = & ./src-tauri/target/release/anydevice.exe --verify-input-owner $PID | ConvertFrom-Json
          if ($LASTEXITCODE -ne 3 -or $denied.ownerVerified) { throw 'Foreign-owner helper was not rejected' }
          Write-Host 'Input helper owner: matching executable/actual parent accepted; shell parent rejected; no input collected.'
          $path = Join-Path $env:RUNNER_TEMP 'input-metadata.json'
          & ./src-tauri/target/release/anydevice.exe --inspect-input | Set-Content -LiteralPath $path -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Native input inspection failed' }
          $metadata = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json
          if ($null -eq $metadata.endpoints -or $metadata.endpoints.Count -gt 256) { throw 'Invalid input metadata envelope' }
          $mapped = @($metadata.endpoints | Where-Object { $_.instanceId }).Count
          Write-Host "Raw Input: $($metadata.endpoints.Count) mouse/keyboard collections; $mapped mapped instance IDs. This does not test physical events."
          Remove-Item -LiteralPath $path
      - name: Verify silent installation and installed desktop launch
        shell: pwsh
        run: |
          $installer = Get-ChildItem ./src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $installPath = Join-Path $env:RUNNER_TEMP 'AnyDevice-installed'
          $setup = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installPath") -PassThru -Wait -WindowStyle Hidden
          if ($setup.ExitCode -ne 0) { throw "Installer failed: $($setup.ExitCode)" }
          $exe = Join-Path $installPath 'anydevice.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw 'Installed executable was not found' }
          $installedHash = (Get-FileHash $exe).Hash
          $releaseHash = (Get-FileHash ./src-tauri/target/release/anydevice.exe).Hash
          Write-Host "Installed SHA256: $installedHash; release SHA256: $releaseHash"
          if ($installedHash -ne $releaseHash) { throw 'Installed binary differs from release binary' }
          $app = Start-Process -FilePath $exe -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 8
          if ($app.HasExited) { throw "Packaged application exited: $($app.ExitCode)" }
          Stop-Process -Id $app.Id
          $uninstaller = Join-Path $installPath 'uninstall.exe'
          if (-not (Test-Path -LiteralPath $uninstaller)) { throw 'Uninstaller was not found' }
          $cleanup = Start-Process -FilePath $uninstaller -ArgumentList '/S' -PassThru -Wait -WindowStyle Hidden
          if ($cleanup.ExitCode -ne 0) { throw "Uninstaller failed: $($cleanup.ExitCode)" }
          # This validates setup/binary integrity/launch/uninstall, not visual UI or physical hardware behavior.
      - name: Stage portable executable and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe release/
          Copy-Item src-tauri/target/release/anydevice.exe release/AnyDevice-0.2.0-windows-x64.exe
          Copy-Item docs/PORTABLE.md release/PORTABLE-README.md
          Get-ChildItem release/*.exe | ForEach-Object { "$( (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() )  $($_.Name)" } | Set-Content release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AnyDevice-0.2.0-windows-x64-unsigned
          path: release/*
          if-no-files-found: error
      - name: Upload portable discovery/workspace build for manual acceptance
        uses: actions/upload-artifact@v4
        with:
          name: AnyDevice-discovery-portable-unsigned
          path: |
            release/AnyDevice-0.2.0-windows-x64.exe
            release/SHA256SUMS.txt
            release/PORTABLE-README.md
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AnyDevice-0.2.0-windows-x64-unsigned
          path: release
      - name: Publish draft release for manual hardware and installer validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --draft --title "AnyDevice $GITHUB_REF_NAME" --notes "Unsigned Windows x64 candidate. Validate installation, UI, offline scanning, cancellation, and sanitized export on physical hardware before publishing. Portable executable requires WebView2."
