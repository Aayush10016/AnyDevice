name: Stage verified Windows release candidate
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Windows desktop build run ID from this repository
        required: true
        type: string
permissions:
  actions: read
  contents: write
jobs:
  draft:
    if: github.repository == 'Aayush10016/AnyDevice'
    runs-on: ubuntu-latest
    steps:
      - name: Validate the source build
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'Invalid run ID'; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" > run.json
          jq -e '.conclusion == "success" and .name == "Windows desktop build" and (.event == "push" or .event == "workflow_dispatch") and .head_repository.full_name == "Aayush10016/AnyDevice"' run.json
          sha=$(jq -r .head_sha run.json)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          gh release view v0.2.0-candidate.3 --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish > release.json
          jq -e --arg sha "$sha" '.isDraft == true and .targetCommitish == $sha' release.json
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: AnyDevice-0.2.0-windows-x64-unsigned
          path: release
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - name: Verify checksums and upload to the verified draft
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          cd release
          sed -i 's/\r$//' SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          cd ..
          cat > notes.md <<'NOTES'
          AnyDevice v0.2.0 Windows x64 candidate. Unsigned installer and standalone executable; SHA-256 checksums included.

          Windows CI verifies frontend/domain/report tests, native boundary and production-asset tests, native/fallback parity and broad PnP discovery, NSIS packaging, silent install, installed/release binary equality, launch, and uninstall. Physical-device discovery was separately verified on the development host.

          This is a draft prerelease, not a completed stable v0.1. Packaged visual/accessibility QA, physical disconnect/reconnect testing, clean-machine Windows 10/11 validation and signing remain required before publication. Portable executable requires WebView2; installer includes its offline installer. Includes native PnP node inspection, bounded snapshot investigations and raw byte analysis. No radio/stream/health diagnosis, Android ADB/MTP diagnosis, traffic capture, parser generation or recovery claims.
          NOTES
          echo "Validated source: $SOURCE_SHA" >> notes.md
          echo "Build: https://github.com/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" >> notes.md
          gh release upload v0.2.0-candidate.3 release/* --repo "$GITHUB_REPOSITORY"

