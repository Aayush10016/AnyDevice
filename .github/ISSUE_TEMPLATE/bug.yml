name: Bug report
description: Report an observable problem without sharing sensitive device identifiers
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: AnyDevice version and Windows version
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence and limitations
      description: Review the report preview first. Do not paste raw serials, instance IDs, personal device names or private paths.
